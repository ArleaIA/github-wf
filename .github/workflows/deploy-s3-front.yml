name: "Reusable - Deploy Front to S3 + CloudFront"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      AWS_REGION:
        required: true
      AWS_ROLE_ARN_INFRA:
        required: true
      S3_BUCKET:
        required: true
      CLOUDFRONT_DISTRIBUTION_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-front-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      region: ${{ secrets.AWS_REGION }}
      role_arn: ${{ secrets.AWS_ROLE_ARN_INFRA }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.role_arn }}
          aws-region: ${{ secrets.AWS_REGION }}
          output-env-credentials: true

      - name: Fetch build config from SSM
        run: |
          ENV=${{ inputs.environment }}
          API_URL=$(aws ssm get-parameter \
            --name "/front/$ENV/API_URL" \
            --query "Parameter.Value" \
            --output text \
            --region ${{ env.region }})
          APP_URL=$(aws ssm get-parameter \
            --name "/front/$ENV/APP_URL" \
            --query "Parameter.Value" \
            --output text \
            --region ${{ env.region }})
          echo "API_URL=$API_URL" >> $GITHUB_ENV
          echo "APP_URL=$APP_URL" >> $GITHUB_ENV

      - name: Build Angular app
        run: npm run build

      - name: Sync to S3
        run: |
          DIST=dist/front-kalai/browser

          # Contrato del asset de media (video hero + poster, E27 T09):
          #   - Vive en arlea-front/public/media/ y el build de Angular copia
          #     public/ a la raiz del dist, por lo que sale como /media/ (NO
          #     /assets/).
          #   - Se sirve desde /media/ a proposito para NO caer en el glob del
          #     service worker de ngsw (/assets/**), que cachearia el video de
          #     varios MB. Por eso /media/ NO recibe Cache-Control "no-cache" ni
          #     "immutable": es media pesada y semi-estable -> cache media/larga
          #     (7 dias). El video es same-origin (bucket propio via CloudFront),
          #     asi que si CloudFront aplica una CSP restrictiva por default-src
          #     basta con media-src 'self'.

          # Sync hashed assets with immutable cache.
          # Exclude non-hashed PWA files (index.html, service worker and manifest):
          # they must always revalidate so CloudFront never serves a stale
          # service worker / manifest that would pin users to an old PWA version.
          # Exclude media/* so el video hero no herede el cache immutable ni el
          # --delete de esta pasada (se sincroniza aparte mas abajo).
          aws s3 sync "$DIST" s3://${{ secrets.S3_BUCKET }} \
            --delete \
            --exclude "index.html" \
            --exclude "ngsw-worker.js" \
            --exclude "ngsw.json" \
            --exclude "safety-worker.js" \
            --exclude "manifest.webmanifest" \
            --exclude "media/*" \
            --cache-control "max-age=31536000,immutable" \
            --region ${{ env.region }}

          # Sync /media/ (video hero + poster) con cache media/larga (7 dias),
          # NO immutable (el asset puede reemplazarse) y NO no-cache.
          if [ -d "$DIST/media" ]; then
            aws s3 sync "$DIST/media" s3://${{ secrets.S3_BUCKET }}/media \
              --delete \
              --cache-control "public,max-age=604800" \
              --region ${{ env.region }}
          fi

          # Sync index.html with no-cache
          aws s3 cp "$DIST/index.html" s3://${{ secrets.S3_BUCKET }}/index.html \
            --cache-control "no-cache" \
            --content-type "text/html" \
            --region ${{ env.region }}

          # Sync non-hashed PWA files with no-cache so updates propagate.
          # Each file may be absent depending on the build, so guard with -f.
          PWA_FILES=(
            "ngsw-worker.js:application/javascript"
            "safety-worker.js:application/javascript"
            "ngsw.json:application/json"
            "manifest.webmanifest:application/manifest+json"
          )
          for entry in "${PWA_FILES[@]}"; do
            file="${entry%%:*}"
            content_type="${entry#*:}"
            if [ -f "$DIST/$file" ]; then
              aws s3 cp "$DIST/$file" "s3://${{ secrets.S3_BUCKET }}/$file" \
                --cache-control "no-cache" \
                --content-type "$content_type" \
                --region ${{ env.region }}
            fi
          done

      - name: Invalidate CloudFront cache
        run: |
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "CloudFront Invalidation ID: $INVALIDATION_ID"
