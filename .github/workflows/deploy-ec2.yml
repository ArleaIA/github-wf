name: "Reusable - Deploy to EC2"

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      service:
        description: 'Service to deploy: worker, scrapper, or all'
        required: true
        type: string
      app_name:
        description: 'ECR repo prefix, e.g., kalai-worker or kalai-scrapper'
        required: true
        type: string
    secrets:
      AWS_REGION:
        required: true
      AWS_ROLE_ARN_INFRA:
        required: true
      EC2_INSTANCE_ID:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      region: ${{ secrets.AWS_REGION }}
      ecr_repo: ${{ inputs.app_name }}-${{ inputs.environment }}
      role_arn: ${{ secrets.AWS_ROLE_ARN_INFRA }}
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.role_arn }}
          aws-region: ${{ secrets.AWS_REGION }}
          output-env-credentials: true

      - name: Login a Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ env.ecr_repo }}
          IMAGE_TAG: ${{ github.run_id }}-${{ github.sha }}
        run: |
          docker build \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2 via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          SERVICE: ${{ inputs.service }}
        run: |
          if [[ ! "$SERVICE" =~ ^(worker|scrapper|all)$ ]]; then
            echo "::error::Invalid service '$SERVICE'. Must be worker, scrapper, or all."
            exit 1
          fi

          COMPOSE_ARGS=""
          if [ "$SERVICE" != "all" ]; then
            COMPOSE_ARGS="$SERVICE"
          fi

          PARAMS=$(jq -n \
            --arg region "$AWS_REGION" \
            --arg registry "$ECR_REGISTRY" \
            --arg compose_args "$COMPOSE_ARGS" \
            '{commands: [
              "set -euo pipefail",
              "cd /opt/arlea/deploy",
              ("aws ecr get-login-password --region " + $region + " | docker login --username AWS --password-stdin " + $registry),
              "docker image prune -af || true",
              ("docker compose pull " + $compose_args),
              ("docker compose up -d --force-recreate " + $compose_args),
              "docker image prune -af || true",
              "docker compose ps"
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --timeout-seconds 300 \
            --comment "Deploy $SERVICE from ${{ github.sha }}" \
            --region "$AWS_REGION" \
            --output text \
            --query 'Command.CommandId')

          echo "SSM Command ID: $COMMAND_ID"

          # Poll until the command reaches a terminal state
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --region "$AWS_REGION" \
              --query 'Status' \
              --output text 2>/dev/null) || true

            case "$STATUS" in
              Success|Failed|TimedOut|Cancelled)
                break
                ;;
            esac

            echo "Waiting for SSM command to complete... (attempt $i, status: ${STATUS:-Pending})"
            sleep 10
          done

          # Detect polling timeout (loop exhausted without reaching a terminal state)
          if [ "$STATUS" != "Success" ] && [ "$STATUS" != "Failed" ] && [ "$STATUS" != "Cancelled" ] && [ "$STATUS" != "TimedOut" ]; then
            echo "::error::SSM command timed out after 10 minutes (still in status: $STATUS)"
            exit 1
          fi

          # Retrieve full command output
          RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --region "$AWS_REGION")

          STATUS=$(echo "$RESULT" | jq -r '.Status')
          echo "Command Status: $STATUS"
          echo "--- stdout ---"
          echo "$RESULT" | jq -r '.StandardOutputContent'

          if [ "$STATUS" != "Success" ]; then
            echo "--- stderr ---"
            echo "$RESULT" | jq -r '.StandardErrorContent'
            echo "::error::SSM command failed with status: $STATUS"
            exit 1
          fi
